# CarlaUnreal 渲染模式 (有窗口显示)
# 启动: sudo UID=$(id -u) GID=$(id -g) docker compose up -d
# 停止: sudo docker compose down

services:
  # 实例1: 端口 2000(RPC) / 2001(Streaming) / 2002(Secondary)
  carla1:
    image: carla:0.10.0
    container_name: carla1
    runtime: nvidia                # GPU 支持
    network_mode: host             # 共享宿主机网络
    ipc: host                      # 共享内存通信
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash Linux/CarlaUnreal.sh -nosound --ros2 -carla-port=2000
    restart: unless-stopped

  # 实例2: 端口 2010(RPC) / 2011(Streaming) / 2012(Secondary)
  # 需要时取消注释即可
  carla2:
    image: carla:0.10.0
    container_name: carla2
    runtime: nvidia
    network_mode: host
    ipc: host
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash Linux/CarlaUnreal.sh -nosound --ros2 -carla-port=2010
    restart: unless-stopped
